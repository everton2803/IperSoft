server {
    listen 80;
    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/renders;
    autoindex off;

    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ "^/m/[A-Za-z0-9_-]{16,}\.(png|svg|html)$" {
        try_files $uri =404;
    }

    location ~ "^/([a-z0-9_-]+)\.(png|html)$" {
        try_files /legacy/$1.$2 =404;
    }

    location = /healthz {
        default_type application/json;
        try_files /_health.json =404;
    }

    location / {
        return 404;
    }
}
