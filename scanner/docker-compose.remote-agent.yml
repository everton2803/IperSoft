# ==============================================================================
# STACK DE AGENTE REMOTO DE REDE (VM ZABBIX PROXY NOS CLIENTES)
# Inclui:
#   1. ipersoft-scanner (Porta 8005): executa os scans sob demanda (ICMP + SNMP)
#      comandados pelo IperSoft Central (sem pesar na infra do brdrive).
#   2. phpipam-agent (Loop 15m): executa ping contínuo (fping) e discovery nas
#      sub-redes daquele cliente no phpIPAM e atualiza o status Online/Offline.
# ==============================================================================

services:
  ipersoft-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipersoft_scanner_probe
    restart: unless-stopped
    ports:
      - "8005:8005"

  phpipam-agent:
    build:
      context: .
      dockerfile: Dockerfile.phpipam-agent
    container_name: phpipam_remote_agent
    restart: unless-stopped
    cap_add:
      - NET_RAW
    environment:
      TZ: America/Sao_Paulo
      # Chave gerada no phpIPAM em: Administration -> Scan agents
      IPAM_AGENT_KEY: "${IPAM_AGENT_KEY:-taionet_agent_9f8e7d6c5b4a3210}"
      # Banco MySQL do phpIPAM central (Oracle Cloud 163.176.247.93 porta 443)
      IPAM_DATABASE_HOST: "${IPAM_DATABASE_HOST:-163.176.247.93}"
      IPAM_DATABASE_USER: "${IPAM_DATABASE_USER:-phpipam}"
      IPAM_DATABASE_PASS: "${IPAM_DATABASE_PASS:-phpipampass}"
      IPAM_DATABASE_NAME: "${IPAM_DATABASE_NAME:-phpipam}"
      IPAM_DATABASE_PORT: "${IPAM_DATABASE_PORT:-443}"
      IPAM_SCAN_INTERVAL_SEC: "${IPAM_SCAN_INTERVAL_SEC:-900}"
