# ==============================================================================
# STACK DE AGENTE REMOTO DE REDE (VM ZABBIX PROXY NOS CLIENTES)
# Inclui:
#   1. ipersoft_scanner (Porta 8005): executa os scans sob demanda (ICMP + SNMP)
#      comandados pelo IperSoft Central (sem pesar na infra do brdrive).
#   2. phpipam_agent (Cron 15m): executa ping contínuo (fping) nas sub-redes
#      daquele cliente no phpIPAM e atualiza o status Online/Offline.
# ==============================================================================

services:
  ipersoft-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipersoft_scanner_probe
    restart: unless-stopped
    ports:
      - "8005:8005"

  phpipam-agent:
    image: phpipam/phpipam-agent:latest
    container_name: phpipam_remote_agent
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # Chave gerada no phpIPAM em: Administration -> Scan agents
      IPAM_AGENT_KEY: "${IPAM_AGENT_KEY:-COLE_AQUI_A_AGENT_KEY_DO_PHPIPAM}"
      # Banco MySQL do phpIPAM central
      IPAM_DATABASE_HOST: "${IPAM_DATABASE_HOST:-10.10.1.2}"
      IPAM_DATABASE_USER: "${IPAM_DATABASE_USER:-phpipam}"
      IPAM_DATABASE_PASS: "${IPAM_DATABASE_PASS:-phpipamadmin}"
      IPAM_DATABASE_NAME: "${IPAM_DATABASE_NAME:-phpipam}"
      IPAM_DATABASE_PORT: "${IPAM_DATABASE_PORT:-3306}"
      IPAM_SCAN_INTERVAL: "15m"
      IPAM_RESET_AUTODISCOVER: "false"
      IPAM_REMOVE_INACTIVE_DHCP: "false"
